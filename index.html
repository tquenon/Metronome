<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0E14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="FlashBeat - Métronome visuel haute précision pour batteurs sur scène." />
  <link id="pwa-manifest" rel="manifest" href="" />
  <title>FlashBeat — Métronome Visuel de Scène</title>

  <!-- Police Inter pour une lisibilité optimale sur scène -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       VARIABLES & DESIGN TOKENS
       ========================================================================== */
    :root {
      --bg-app: #0B0E14;
      --bg-panel: #131720;
      --bg-card: #1A202C;
      --bg-card-hover: #222938;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);

      --text-primary: #FFFFFF;
      --text-secondary: #8A94A6;
      --text-muted: #5A6475;

      --accent-red: #FF3B5C;
      --accent-red-glow: rgba(255, 59, 92, 0.55);
      --accent-green: #00E676;
      --accent-green-glow: rgba(0, 230, 118, 0.55);
      --accent-green-bg: rgba(0, 230, 118, 0.12);
      --accent-blue: #00B0FF;
      --accent-blue-glow: rgba(0, 176, 255, 0.55);
      --accent-blue-bg: rgba(0, 176, 255, 0.12);

      --beat-mute: #64748B;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-main);
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* ==========================================================================
       BANDE LUMINEUSE / HALO D'ÉCRAN (SYNCHRONISÉ AVEC LES TEMPS)
       ========================================================================== */
    #screen-halo {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      border: 0px solid transparent;
      box-shadow: inset 0 0 0px transparent;
      opacity: 0;
      transition: opacity 0.08s ease-out, box-shadow 0.08s ease-out;
    }

    #screen-halo.flash-red {
      opacity: 1;
      border: 4px solid var(--accent-red);
      box-shadow:
        inset 0 0 55px rgba(255, 59, 92, 0.65),
        inset 0 0 120px rgba(255, 59, 92, 0.25);
    }

    #screen-halo.flash-green {
      opacity: 1;
      border: 4px solid var(--accent-green);
      box-shadow:
        inset 0 0 55px rgba(0, 230, 118, 0.65),
        inset 0 0 120px rgba(0, 230, 118, 0.25);
    }

    /* ==========================================================================
       CONTENEUR PRINCIPAL & ARCHITECTURE PORTRAIT / PAYSAGE
       ========================================================================== */
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 14px) env(safe-area-inset-bottom, 10px) env(safe-area-inset-left, 14px);
      max-width: 600px;
      margin: 0 auto;
    }

    /* En-tête minimaliste centré */
    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0 6px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .logo {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .logo .flash {
      color: #FFFFFF;
    }

    .logo .beat {
      color: var(--accent-green);
    }

    /* Zone principale adaptable (Portrait : colonne / Paysage : 55% gauche / 45% droite) */
    main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      padding-top: 6px;
    }

    /* ==========================================================================
       ZONE VISUELLE (MESURE, PASTILLES DE TEMPS, PAD CENTRAL, SUBDIVISIONS)
       ========================================================================== */
    #visual-stage {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.8vh, 16px);
      padding: 4px 0;
    }

    /* Indicateur de mesure */
    .measure-label {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    /* Pastilles des temps */
    .beat-dots-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 100%;
      padding: 0 8px;
    }

    .beat-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: #161B26;
      border: 2px solid #2A3241;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      text-align: center;
      transition: transform 0.06s ease-out, background-color 0.06s ease-out, border-color 0.06s ease-out, box-shadow 0.06s ease-out;
    }

    .beat-dot > span {
      display: block;
      line-height: 1;
      transform: translateY(-0.03em);
    }

    /* Pastilles compactes si > 8 temps en mode Perso */
    .beat-dots-row.compact .beat-dot {
      width: 28px;
      height: 28px;
      font-size: 0.75rem;
    }

    /* État par défaut du 1er temps / accentué au repos */
    .beat-dot.type-accent {
      border-color: rgba(255, 59, 92, 0.75);
      color: var(--accent-red);
    }

    .beat-dot.type-mute {
      border-color: #232936;
      color: #4A5568;
      opacity: 0.65;
    }

    /* Pastille illuminée en temps réel */
    .beat-dot.active-red {
      background-color: rgba(255, 59, 92, 0.25);
      border-color: var(--accent-red);
      color: #FFFFFF;
      box-shadow: 0 0 14px var(--accent-red-glow);
      transform: scale(1.1);
    }

    .beat-dot.active-green {
      background-color: rgba(0, 230, 118, 0.25);
      border-color: var(--accent-green);
      color: #FFFFFF;
      box-shadow: 0 0 14px var(--accent-green-glow);
      transform: scale(1.1);
    }

    .beat-dot.active-mute {
      background-color: rgba(100, 116, 139, 0.25);
      border-color: var(--beat-mute);
      color: #CBD5E1;
      transform: scale(1.06);
    }

    /* Pad Central Parfaitement Rond (aspect-ratio 1:1) */
    .pad-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 1 auto;
    }

    #central-pad {
      width: clamp(135px, 24vh, 215px);
      height: clamp(135px, 24vh, 215px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #232A38 0%, #141822 75%);
      border: 3px solid #262E3D;
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.6),
        inset 0 2px 6px rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.05s ease-out, background 0.05s ease-out, border-color 0.05s ease-out, box-shadow 0.05s ease-out;
    }

    #central-pad-number {
      font-size: clamp(3.6rem, 8.5vh, 5.8rem);
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0;
      margin: 0;
      transform: translateY(-0.04em);
      color: #FFFFFF;
      letter-spacing: -0.04em;
      transition: color 0.05s ease-out;
    }

    /* États Flash du Pad Central */
    #central-pad.flash-red {
      background: radial-gradient(circle at 50% 50%, #FF6680 0%, #FF3B5C 75%);
      border-color: #FF94A6;
      box-shadow:
        0 0 42px var(--accent-red-glow),
        0 0 80px rgba(255, 59, 92, 0.35);
      transform: scale(1.035);
    }

    #central-pad.flash-red #central-pad-number {
      color: #0B0E14;
    }

    #central-pad.flash-green {
      background: radial-gradient(circle at 50% 50%, #52FF9E 0%, #00E676 75%);
      border-color: #9EFFC6;
      box-shadow:
        0 0 42px var(--accent-green-glow),
        0 0 80px rgba(0, 230, 118, 0.35);
      transform: scale(1.035);
    }

    #central-pad.flash-green #central-pad-number {
      color: #0B0E14;
    }

    #central-pad.flash-mute {
      background: radial-gradient(circle at 50% 50%, #334155 0%, #1E293B 80%);
      border-color: #64748B;
      transform: scale(1.015);
    }

    #central-pad.flash-mute #central-pad-number {
      color: #94A3B8;
    }

    /* Pilule des Subdivisions sous le pad central */
    #subdivision-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #131822;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 7px 16px;
      min-height: 30px;
      transition: opacity 0.15s ease;
    }

    #subdivision-pill.hidden {
      display: none;
    }

    .sub-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #1C2331;
      border: 2px solid #384357;
      transition: background-color 0.05s ease-out, border-color 0.05s ease-out, box-shadow 0.05s ease-out, transform 0.05s ease-out;
    }

    .sub-dot.active {
      background-color: var(--accent-blue);
      border-color: #80D8FF;
      box-shadow: 0 0 12px var(--accent-blue-glow);
      transform: scale(1.25);
    }

    /* ==========================================================================
       ZONE DE CONTRÔLES (PANNEAU BAS EN PORTRAIT / 45% DROITE EN PAYSAGE)
       ========================================================================== */
    #controls-panel {
      flex: 0 0 auto;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.35);
    }

    /* 1. Ligne Tempo (-5, -1, BPM direct, +1, +5, TAP) */
    .tempo-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1.65fr 1fr 0.85fr 1.25fr;
      gap: 6px;
      align-items: stretch;
    }

    .ctrl-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: var(--font-main);
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      min-height: 44px;
      transition: background-color 0.1s ease, border-color 0.15s ease, transform 0.08s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.95);
      background-color: var(--bg-card-hover);
    }

    /* Bloc central BPM éditable */
    .bpm-display-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 2px;
      cursor: text;
      position: relative;
      transition: border-color 0.15s ease;
    }

    .bpm-display-box:focus-within {
      border-color: var(--accent-green);
    }

    #bpm-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-family: var(--font-main);
      font-size: 1.35rem;
      font-weight: 900;
      text-align: center;
      line-height: 1.05;
      padding: 0;
      -moz-appearance: textfield;
    }

    #bpm-input::-webkit-outer-spin-button,
    #bpm-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .bpm-unit {
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--accent-green);
      margin-top: 1px;
    }

    #btn-tap {
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    #btn-tap.tapped {
      border-color: var(--accent-blue);
      background-color: var(--accent-blue-bg);
      color: var(--accent-blue);
    }

    /* 2. Curseur (Slider 30 - 260) */
    .slider-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slider-bound {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-secondary);
      min-width: 22px;
      text-align: center;
    }

    input[type="range"]#bpm-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 6px;
      background: #262E3D;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]#bpm-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-green);
      border: 3px solid #0B0E14;
      box-shadow: 0 0 0 2px var(--accent-green), 0 0 12px var(--accent-green-glow);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    input[type="range"]#bpm-slider::-webkit-slider-thumb:active {
      transform: scale(1.15);
    }

    input[type="range"]#bpm-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-green);
      border: 3px solid #0B0E14;
      box-shadow: 0 0 0 2px var(--accent-green), 0 0 12px var(--accent-green-glow);
      cursor: pointer;
    }

    /* 3. Bouton Principal DÉMARRER / ARRÊTER */
    #btn-toggle-play {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 14px;
      background-color: var(--accent-green);
      color: #0B0E14;
      font-family: var(--font-main);
      font-size: 0.98rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 230, 118, 0.28);
      transition: background-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
    }

    #btn-toggle-play:active {
      transform: scale(0.985);
    }

    #btn-toggle-play.playing {
      background-color: var(--accent-red);
      color: #FFFFFF;
      box-shadow: 0 4px 18px rgba(255, 59, 92, 0.35);
    }

    /* Groupes de sections (Signature Rythmique, Subdivisions) */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    /* 4. Signature Rythmique */
    .sig-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .sig-btn {
      min-height: 36px;
      border-radius: 10px;
      font-size: 0.84rem;
    }

    .sig-btn.active {
      border-color: var(--accent-green);
      background-color: var(--accent-green-bg);
      color: var(--accent-green);
    }

    #btn-perso {
      width: 100%;
      min-height: 36px;
      border-radius: 10px;
      font-size: 0.84rem;
    }

    #btn-perso.active {
      border-color: var(--accent-green);
      background-color: var(--accent-green-bg);
      color: var(--accent-green);
    }

    /* Tiroir de configuration Perso (1 à 16 temps + accents cliquables) */
    #perso-drawer {
      display: none;
      flex-direction: column;
      gap: 8px;
      background-color: #0F131B;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 10px;
    }

    #perso-drawer.open {
      display: flex;
    }

    .perso-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .perso-count-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .perso-step-btn {
      width: 32px;
      height: 32px;
      min-height: 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 900;
    }

    #perso-count-label {
      font-size: 0.84rem;
      font-weight: 800;
      color: #FFFFFF;
      min-width: 66px;
      text-align: center;
    }

    .perso-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .perso-beats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .perso-beat-pill {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 2px solid transparent;
      font-family: var(--font-main);
      font-size: 0.8rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      padding: 0;
      margin: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease;
    }

    .perso-beat-pill > span {
      display: block;
      line-height: 1;
      transform: translateY(-0.03em);
    }

    .perso-beat-pill:active {
      transform: scale(0.9);
    }

    .perso-beat-pill[data-state="accent"] {
      background-color: rgba(255, 59, 92, 0.2);
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .perso-beat-pill[data-state="normal"] {
      background-color: rgba(0, 230, 118, 0.16);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .perso-beat-pill[data-state="mute"] {
      background-color: rgba(100, 116, 139, 0.16);
      border-color: var(--beat-mute);
      color: #94A3B8;
    }

    /* 5. Subdivisions */
    .sub-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .sub-btn {
      min-height: 36px;
      border-radius: 10px;
      font-size: 0.82rem;
    }

    .sub-btn.active {
      border-color: var(--accent-blue);
      background-color: var(--accent-blue-bg);
      color: var(--accent-blue);
    }

    /* 6. Bascules Audio & Visuelles (Bip ON, Croche ON, Halo ON) */
    .toggles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .toggle-btn {
      min-height: 38px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-secondary);
    }

    .toggle-btn.active {
      border-color: rgba(0, 230, 118, 0.55);
      background-color: var(--accent-green-bg);
      color: var(--accent-green);
    }

    /* ==========================================================================
       RESPONSIVE & ROTATION D'ÉCRAN (MODE PAYSAGE / LANDSCAPE)
       - 55% gauche : Zone visuelle (Mesure, pastilles, pad rond, subdivisions)
       - 45% droite : Panneau de configuration dans le même ordre
       ========================================================================== */
    @media (orientation: landscape) and (min-width: 560px) {
      #app {
        max-width: 100%;
        padding: 6px 14px;
      }

      header {
        padding: 2px 0 4px;
      }

      .logo {
        font-size: 1.2rem;
      }

      main {
        flex-direction: row;
        align-items: stretch;
        gap: 14px;
        padding-top: 6px;
      }

      /* 55% gauche attribués à la zone visuelle */
      #visual-stage {
        flex: 0 0 55%;
        width: 55%;
        height: 100%;
        justify-content: center;
        gap: clamp(6px, 2vh, 14px);
      }

      #central-pad {
        width: clamp(120px, 44vh, 250px);
        height: clamp(120px, 44vh, 250px);
      }

      #central-pad-number {
        font-size: clamp(3.2rem, 16vh, 6.2rem);
      }

      /* 45% droite attribués aux contrôles */
      #controls-panel {
        flex: 1 1 45%;
        width: 45%;
        height: 100%;
        overflow-y: auto;
        justify-content: space-between;
        padding: 10px 12px;
        gap: 6px;
        border-radius: 18px;
      }

      .ctrl-btn {
        min-height: 36px;
        font-size: 0.8rem;
      }

      #bpm-input {
        font-size: 1.15rem;
      }

      .slider-container {
        padding: 5px 10px;
      }

      #btn-toggle-play {
        min-height: 40px;
        font-size: 0.9rem;
      }

      .sig-btn, #btn-perso, .sub-btn {
        min-height: 31px;
        font-size: 0.78rem;
      }

      .toggle-btn {
        min-height: 33px;
        font-size: 0.74rem;
      }

      .section-title {
        font-size: 0.62rem;
      }
    }

    /* Ajustement petits écrans portrait (hauteur < 680px) */
    @media (orientation: portrait) and (max-height: 680px) {
      header {
        padding: 4px 0;
      }
      .logo {
        font-size: 1.25rem;
      }
      #central-pad {
        width: 125px;
        height: 125px;
      }
      #central-pad-number {
        font-size: 3.4rem;
      }
      #controls-panel {
        padding: 9px;
        gap: 7px;
      }
      .ctrl-btn {
        min-height: 38px;
      }
      #btn-toggle-play {
        min-height: 42px;
      }
      .sig-btn, #btn-perso, .sub-btn, .toggle-btn {
        min-height: 32px;
      }
    }
  </style>
</head>
<body>
  <!-- Halo / Bande lumineuse périphérique -->
  <div id="screen-halo" aria-hidden="true"></div>

  <div id="app">
    <!-- En-tête minimaliste sans boutons superflus -->
    <header>
      <div class="logo" aria-label="FlashBeat">
        <span class="flash">Flash</span><span class="beat">Beat</span>
      </div>
    </header>

    <main>
      <!-- ZONE VISUELLE (Haut en portrait / 55% gauche en paysage) -->
      <section id="visual-stage" aria-label="Affichage visuel du métronome">
        <div id="measure-indicator" class="measure-label">MESURE #0</div>

        <!-- Pastilles de temps -->
        <div id="beat-dots-container" class="beat-dots-row" role="status" aria-live="off"></div>

        <!-- Pad Central Parfaitement Rond (1:1) -->
        <div class="pad-wrapper">
          <div id="central-pad">
            <span id="central-pad-number">1</span>
          </div>
        </div>

        <!-- Subdivisions (Croches / Doubles) -->
        <div id="subdivision-pill" aria-hidden="true"></div>
      </section>

      <!-- ZONE DE CONTRÔLES (Bas en portrait / 45% droite en paysage) -->
      <section id="controls-panel" aria-label="Paramètres du métronome">
        <!-- 1. Ligne Tempo -->
        <div class="tempo-row">
          <button type="button" class="ctrl-btn" id="btn-minus-5" aria-label="Diminuer de 5 BPM">-5</button>
          <button type="button" class="ctrl-btn" id="btn-minus-1" aria-label="Diminuer de 1 BPM">-1</button>

          <label class="bpm-display-box" for="bpm-input" title="Cliquer pour saisir un tempo entre 30 et 260">
            <input type="number" id="bpm-input" value="120" min="30" max="260" inputmode="numeric" aria-label="Tempo en BPM" />
            <span class="bpm-unit">BPM</span>
          </label>

          <button type="button" class="ctrl-btn" id="btn-plus-1" aria-label="Augmenter de 1 BPM">+1</button>
          <button type="button" class="ctrl-btn" id="btn-plus-5" aria-label="Augmenter de 5 BPM">+5</button>
          <button type="button" class="ctrl-btn" id="btn-tap" aria-label="Tap tempo">TAP</button>
        </div>

        <!-- 2. Curseur (Slider) -->
        <div class="slider-container">
          <span class="slider-bound">30</span>
          <input type="range" id="bpm-slider" min="30" max="260" value="120" aria-label="Curseur de tempo" />
          <span class="slider-bound">260</span>
        </div>

        <!-- 3. Bouton Principal Démarrer / Arrêter -->
        <button type="button" id="btn-toggle-play">DÉMARRER</button>

        <!-- 4. Signature Rythmique -->
        <div class="control-group">
          <div class="section-title">Signature Rythmique</div>
          <div class="sig-grid">
            <button type="button" class="ctrl-btn sig-btn" data-beats="2">2/4</button>
            <button type="button" class="ctrl-btn sig-btn" data-beats="3">3/4</button>
            <button type="button" class="ctrl-btn sig-btn active" data-beats="4">4/4</button>
            <button type="button" class="ctrl-btn sig-btn" data-beats="5">5/4</button>
          </div>
          <button type="button" class="ctrl-btn" id="btn-perso">Perso</button>

          <!-- Panneau de configuration Perso (1 à 16 temps + accents) -->
          <div id="perso-drawer" aria-label="Configuration rythmique personnalisée">
            <div class="perso-header">
              <div class="perso-count-controls">
                <button type="button" class="ctrl-btn perso-step-btn" id="perso-minus" aria-label="Retirer un temps">-</button>
                <span id="perso-count-label">6 temps</span>
                <button type="button" class="ctrl-btn perso-step-btn" id="perso-plus" aria-label="Ajouter un temps">+</button>
              </div>
              <div class="perso-legend">
                <span class="legend-item"><span class="legend-dot" style="background: var(--accent-red);"></span>Fort</span>
                <span class="legend-item"><span class="legend-dot" style="background: var(--accent-green);"></span>Normal</span>
                <span class="legend-item"><span class="legend-dot" style="background: var(--beat-mute);"></span>Muet</span>
              </div>
            </div>
            <div id="perso-beats-grid" class="perso-beats-grid"></div>
          </div>
        </div>

        <!-- 5. Subdivisions -->
        <div class="control-group">
          <div class="section-title">Subdivisions</div>
          <div class="sub-grid">
            <button type="button" class="ctrl-btn sub-btn" data-sub="1">Noires</button>
            <button type="button" class="ctrl-btn sub-btn" data-sub="2">Croches</button>
            <button type="button" class="ctrl-btn sub-btn active" data-sub="4">Doubles</button>
          </div>
        </div>

        <!-- 6. Options Audio & Visuelles -->
        <div class="toggles-grid">
          <button type="button" class="ctrl-btn toggle-btn active" id="toggle-bip" aria-pressed="true">Bip ON</button>
          <button type="button" class="ctrl-btn toggle-btn active" id="toggle-croche" aria-pressed="true">Croche ON</button>
          <button type="button" class="ctrl-btn toggle-btn active" id="toggle-halo" aria-pressed="true">Halo ON</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    /**
     * ==========================================================================
     * FLASHBEAT — MOTEUR AUDIO WEB AUDIO API & SYNCHRONISATION SCÉNIQUE
     * ==========================================================================
     */
    (() => {
      'use strict';

      /* ------------------------------------------------------------------------
         3. ÉTAT GLOBAL DE L'APPLICATION & PERSISTANCE ROTATION / RECHARGEMENT
         ------------------------------------------------------------------------ */
      const MIN_BPM = 30;
      const MAX_BPM = 260;
      const STORAGE_KEY = 'flashbeat_state_v1';

      /* ------------------------------------------------------------------------
         1. MANIFESTE PWA DYNAMIQUE (DATA URI)
         ------------------------------------------------------------------------ */
      function initDynamicPWAManifest() {
        try {
          const manifestEl = document.getElementById('pwa-manifest');
          if (!manifestEl) return;
          const manifest = {
            name: 'FlashBeat — Métronome Visuel',
            short_name: 'FlashBeat',
            start_url: '.',
            display: 'standalone',
            background_color: '#0B0E14',
            theme_color: '#0B0E14',
            orientation: 'any',
            icons: [
              {
                src: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="42" fill="#0B0E14"/><circle cx="96" cy="96" r="64" fill="#00E676"/><text x="96" y="118" font-family="sans-serif" font-weight="900" font-size="76" text-anchor="middle" fill="#0B0E14">1</text></svg>'),
                sizes: '192x192',
                type: 'image/svg+xml'
              }
            ]
          };
          manifestEl.setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));
        } catch (err) {
          // Ignorer si l'environnement restreint le manifeste
        }
      }

      /* ------------------------------------------------------------------------
         2. VERROUILLAGE D'ÉCRAN PERMANENT ANDROID (SCREEN WAKE LOCK API)
         ------------------------------------------------------------------------ */
      let wakeLockSentinel = null;

      async function requestScreenWakeLock() {
        try {
          if (!('wakeLock' in navigator)) return;
          if (wakeLockSentinel !== null && !wakeLockSentinel.released) return;
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
          });
        } catch (err) {
          // Autorisation refusée ou non supportée dans cet environnement
        }
      }

      async function releaseScreenWakeLock() {
        try {
          if (wakeLockSentinel !== null) {
            await wakeLockSentinel.release();
            wakeLockSentinel = null;
          }
        } catch (err) {
          wakeLockSentinel = null;
        }
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          requestScreenWakeLock();
          if (state.isPlaying) {
            ensureAudioContext();
          }
        }
      });

      const state = {
        isPlaying: false,
        bpm: 120,
        mode: 'preset', // 'preset' | 'custom'
        presetBeats: 4,
        customBeatsCount: 6,
        customPattern: ['accent', 'normal', 'normal', 'accent', 'normal', 'normal'], // 'accent' | 'normal' | 'mute'
        subdivision: 4, // 1 = Noires, 2 = Croches, 4 = Doubles
        bipOn: true,
        crocheOn: true,
        haloOn: true,

        // Compteurs temps réel & horodatage pour continuité lors de rotation
        measureNumber: 0,
        currentBeatIndex: 0, // 0-indexed
        currentSubIndex: 0,
        lastTickTimestamp: 0
      };

      function saveAppState() {
        try {
          const snapshot = {
            bpm: state.bpm,
            signature: state.mode === 'custom' ? 'perso' : `${state.presetBeats}/4`,
            mode: state.mode,
            presetBeats: state.presetBeats,
            customBeats: state.customBeatsCount,
            customAccents: state.customPattern.slice(0, 16),
            subdivision: state.subdivision,
            bipOn: state.bipOn,
            crocheOn: state.crocheOn,
            haloOn: state.haloOn,
            isPlaying: state.isPlaying,
            currentMeasure: state.measureNumber,
            currentBeat: state.currentBeatIndex,
            lastTickTimestamp: state.lastTickTimestamp || Date.now()
          };
          const serialized = JSON.stringify(snapshot);
          sessionStorage.setItem(STORAGE_KEY, serialized);
          localStorage.setItem(STORAGE_KEY, serialized);
        } catch (err) {
          // Ignorer si le stockage est restreint
        }
      }

      function loadAppState() {
        try {
          const raw = sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const saved = JSON.parse(raw);
          if (!saved || typeof saved !== 'object') return false;

          if (typeof saved.bpm === 'number') {
            state.bpm = Math.min(MAX_BPM, Math.max(MIN_BPM, Math.round(saved.bpm)));
          }
          if (saved.mode === 'custom' || saved.mode === 'preset') {
            state.mode = saved.mode;
          }
          if (typeof saved.presetBeats === 'number' && [2, 3, 4, 5].includes(saved.presetBeats)) {
            state.presetBeats = saved.presetBeats;
          }
          if (typeof saved.customBeats === 'number') {
            state.customBeatsCount = Math.min(16, Math.max(1, Math.round(saved.customBeats)));
          }
          if (Array.isArray(saved.customAccents) && saved.customAccents.length > 0) {
            state.customPattern = saved.customAccents.slice(0, 16).map((item) =>
              ['accent', 'normal', 'mute'].includes(item) ? item : 'normal'
            );
          }
          if ([1, 2, 4].includes(saved.subdivision)) {
            state.subdivision = saved.subdivision;
          }
          if (typeof saved.bipOn === 'boolean') state.bipOn = saved.bipOn;
          if (typeof saved.crocheOn === 'boolean') state.crocheOn = saved.crocheOn;
          if (typeof saved.haloOn === 'boolean') state.haloOn = saved.haloOn;
          if (typeof saved.isPlaying === 'boolean') state.isPlaying = saved.isPlaying;

          const totalBeats = state.mode === 'custom' ? state.customBeatsCount : state.presetBeats;
          let restoredMeasure = typeof saved.currentMeasure === 'number' ? Math.max(0, saved.currentMeasure) : 0;
          let restoredBeat = typeof saved.currentBeat === 'number' ? Math.max(0, saved.currentBeat % totalBeats) : 0;

          // Si la WebView a rechargé la page pendant la lecture lors d'une rotation,
          // recalcule la mesure et le temps exacts écoulés depuis le dernier tick
          if (state.isPlaying && typeof saved.lastTickTimestamp === 'number' && saved.lastTickTimestamp > 0) {
            const elapsedMs = Math.max(0, Date.now() - saved.lastTickTimestamp);
            const beatDurationMs = 60000 / state.bpm;
            const elapsedBeats = Math.floor(elapsedMs / beatDurationMs);
            if (elapsedBeats > 0) {
              const absoluteBeat = restoredMeasure * totalBeats + restoredBeat + elapsedBeats;
              restoredMeasure = Math.floor(absoluteBeat / totalBeats);
              restoredBeat = absoluteBeat % totalBeats;
            }
          }

          state.measureNumber = restoredMeasure;
          state.currentBeatIndex = restoredBeat;
          state.lastTickTimestamp = typeof saved.lastTickTimestamp === 'number' ? saved.lastTickTimestamp : 0;
          return true;
        } catch (err) {
          return false;
        }
      }

      /* ------------------------------------------------------------------------
         4. RÉFÉRENCES DOM
         ------------------------------------------------------------------------ */
      const dom = {
        screenHalo: document.getElementById('screen-halo'),
        measureIndicator: document.getElementById('measure-indicator'),
        beatDotsContainer: document.getElementById('beat-dots-container'),
        centralPad: document.getElementById('central-pad'),
        centralPadNumber: document.getElementById('central-pad-number'),
        subdivisionPill: document.getElementById('subdivision-pill'),

        btnMinus5: document.getElementById('btn-minus-5'),
        btnMinus1: document.getElementById('btn-minus-1'),
        bpmInput: document.getElementById('bpm-input'),
        btnPlus1: document.getElementById('btn-plus-1'),
        btnPlus5: document.getElementById('btn-plus-5'),
        btnTap: document.getElementById('btn-tap'),
        bpmSlider: document.getElementById('bpm-slider'),
        btnTogglePlay: document.getElementById('btn-toggle-play'),

        sigButtons: document.querySelectorAll('.sig-btn'),
        btnPerso: document.getElementById('btn-perso'),
        persoDrawer: document.getElementById('perso-drawer'),
        persoMinus: document.getElementById('perso-minus'),
        persoPlus: document.getElementById('perso-plus'),
        persoCountLabel: document.getElementById('perso-count-label'),
        persoBeatsGrid: document.getElementById('perso-beats-grid'),

        subButtons: document.querySelectorAll('.sub-btn'),
        toggleBip: document.getElementById('toggle-bip'),
        toggleCroche: document.getElementById('toggle-croche'),
        toggleHalo: document.getElementById('toggle-halo')
      };

      /* ------------------------------------------------------------------------
         5. UTILITAIRES DE SIGNATURE RYTHMIQUE
         ------------------------------------------------------------------------ */
      function getActivePattern() {
        if (state.mode === 'custom') {
          return state.customPattern.slice(0, state.customBeatsCount);
        }
        const arr = [];
        for (let i = 0; i < state.presetBeats; i++) {
          arr.push(i === 0 ? 'accent' : 'normal');
        }
        return arr;
      }

      function renderBeatDots() {
        const pattern = getActivePattern();
        dom.beatDotsContainer.innerHTML = '';
        dom.beatDotsContainer.classList.toggle('compact', pattern.length > 8);

        pattern.forEach((type, idx) => {
          const dot = document.createElement('div');
          dot.className = `beat-dot type-${type}`;
          const numSpan = document.createElement('span');
          numSpan.textContent = String(idx + 1);
          dot.appendChild(numSpan);
          dot.dataset.index = String(idx);
          dom.beatDotsContainer.appendChild(dot);
        });
      }

      function renderSubdivisionDots() {
        if (state.subdivision === 1) {
          dom.subdivisionPill.classList.add('hidden');
          dom.subdivisionPill.innerHTML = '';
          return;
        }
        dom.subdivisionPill.classList.remove('hidden');
        dom.subdivisionPill.innerHTML = '';
        for (let i = 0; i < state.subdivision; i++) {
          const subDot = document.createElement('div');
          subDot.className = 'sub-dot';
          subDot.dataset.subIndex = String(i);
          dom.subdivisionPill.appendChild(subDot);
        }
      }

      function renderPersoDrawer() {
        dom.persoCountLabel.textContent = `${state.customBeatsCount} temps`;
        dom.persoBeatsGrid.innerHTML = '';

        // Assurer que customPattern a toujours 16 entrées valides
        while (state.customPattern.length < 16) {
          state.customPattern.push('normal');
        }

        for (let i = 0; i < state.customBeatsCount; i++) {
          const beatState = state.customPattern[i];
          const pill = document.createElement('button');
          pill.type = 'button';
          pill.className = 'perso-beat-pill';
          pill.dataset.state = beatState;
          const pillSpan = document.createElement('span');
          pillSpan.textContent = String(i + 1);
          pill.appendChild(pillSpan);
          pill.title = `Temps ${i + 1} : cliquer pour changer l'accent`;

          pill.addEventListener('click', () => {
            const order = ['accent', 'normal', 'mute'];
            const next = order[(order.indexOf(state.customPattern[i]) + 1) % order.length];
            state.customPattern[i] = next;
            renderPersoDrawer();
            renderBeatDots();
            saveAppState();
          });

          dom.persoBeatsGrid.appendChild(pill);
        }
      }

      function syncControlsWithState() {
        dom.bpmInput.value = String(state.bpm);
        dom.bpmSlider.value = String(state.bpm);

        dom.sigButtons.forEach((btn) => {
          const isMatch = state.mode === 'preset' && Number(btn.dataset.beats) === state.presetBeats;
          btn.classList.toggle('active', isMatch);
        });
        dom.btnPerso.classList.toggle('active', state.mode === 'custom');

        dom.subButtons.forEach((btn) => {
          btn.classList.toggle('active', Number(btn.dataset.sub) === state.subdivision);
        });

        dom.toggleBip.classList.toggle('active', state.bipOn);
        dom.toggleBip.setAttribute('aria-pressed', String(state.bipOn));
        dom.toggleBip.textContent = state.bipOn ? 'Bip ON' : 'Bip OFF';

        dom.toggleCroche.classList.toggle('active', state.crocheOn);
        dom.toggleCroche.setAttribute('aria-pressed', String(state.crocheOn));
        dom.toggleCroche.textContent = state.crocheOn ? 'Croche ON' : 'Croche OFF';

        dom.toggleHalo.classList.toggle('active', state.haloOn);
        dom.toggleHalo.setAttribute('aria-pressed', String(state.haloOn));
        dom.toggleHalo.textContent = state.haloOn ? 'Halo ON' : 'Halo OFF';

        dom.measureIndicator.textContent = `MESURE #${state.measureNumber}`;
        dom.centralPadNumber.textContent = String(state.currentBeatIndex + 1);
      }

      /* ------------------------------------------------------------------------
         6. MOTEUR AUDIO HAUTE PRÉCISION (WEB AUDIO API + LOOKAHEAD SCHEDULER)
         ------------------------------------------------------------------------ */
      let audioCtx = null;
      let schedulerTimerId = null;
      let nextNoteTime = 0.0;
      let scheduleBeatIndex = 0;
      let scheduleSubIndex = 0;
      let scheduleMeasure = 0;

      // File d'événements visuels synchronisés sur audioCtx.currentTime
      const visualQueue = [];
      let flashTimeoutId = null;
      let rafId = null;

      const LOOKAHEAD_MS = 20.0;       // Intervalle de vérification (20 ms)
      const SCHEDULE_AHEAD_SEC = 0.1;  // Fenêtre d'anticipation audio (100 ms)

      function ensureAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      /**
       * Synthétise une impulsion percussive ultra-nette sans latence ni fichier externe
       */
      function scheduleAudioClick(time, isMainBeat, beatType, subIndex) {
        if (!audioCtx) return;

        // Temps principal (subIndex === 0)
        if (isMainBeat) {
          if (!state.bipOn || beatType === 'mute') return;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          // Fréquence : 1320 Hz (accentué rouge) vs 880 Hz (normal vert)
          const freq = beatType === 'accent' ? 1320 : 880;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.55, time + 0.045);

          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(beatType === 'accent' ? 0.9 : 0.65, time + 0.003);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.055);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(time);
          osc.stop(time + 0.06);
        } else {
          // Subdivision (croche / double-croche)
          if (!state.crocheOn) return;

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          // Légère différence de timbre sur le contretemps ("et") vs doubles intermédiaires
          const isAndBeat = (state.subdivision === 4 && subIndex === 2) || state.subdivision === 2;
          const freq = isAndBeat ? 660 : 560;

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, time);

          gain.gain.setValueAtTime(0.001, time);
          gain.gain.linearRampToValueAtTime(0.38, time + 0.002);
          gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.035);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(time);
          osc.stop(time + 0.04);
        }
      }

      /**
       * Planifie le pas courant et avance les compteurs rythmiques
       */
      function scheduleNote(time) {
        const pattern = getActivePattern();
        const totalBeats = pattern.length;

        // Sécurité si la signature rythmique a été réduite en cours de lecture
        if (scheduleBeatIndex >= totalBeats) {
          scheduleBeatIndex = 0;
        }
        if (scheduleSubIndex >= state.subdivision) {
          scheduleSubIndex = 0;
        }

        const beatType = pattern[scheduleBeatIndex];
        const isMainBeat = scheduleSubIndex === 0;

        // 1. Planification Audio exacte
        scheduleAudioClick(time, isMainBeat, beatType, scheduleSubIndex);

        // 2. Empilement dans la file visuelle avec horodatage audio exact
        visualQueue.push({
          time,
          measure: scheduleMeasure,
          beatIndex: scheduleBeatIndex,
          beatType,
          subIndex: scheduleSubIndex,
          subdivisionCount: state.subdivision
        });

        // 3. Avancement temporel précis
        const secondsPerBeat = 60.0 / state.bpm;
        const secondsPerSub = secondsPerBeat / state.subdivision;
        nextNoteTime += secondsPerSub;

        scheduleSubIndex++;
        if (scheduleSubIndex >= state.subdivision) {
          scheduleSubIndex = 0;
          scheduleBeatIndex++;
          if (scheduleBeatIndex >= totalBeats) {
            scheduleBeatIndex = 0;
            scheduleMeasure++;
          }
        }
      }

      function schedulerLoop() {
        if (!state.isPlaying || !audioCtx) return;
        while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD_SEC) {
          scheduleNote(nextNoteTime);
        }
      }

      /* ------------------------------------------------------------------------
         7. BOUCLE DE RENDU VISUEL SYNCHRONISÉE (REQUESTANIMATIONFRAME)
         ------------------------------------------------------------------------ */
      function triggerVisualStep(event) {
        const { measure, beatIndex, beatType, subIndex, subdivisionCount } = event;

        // Mise à jour de l'état courant et sauvegarde continue à chaque temps
        state.measureNumber = measure;
        state.currentBeatIndex = beatIndex;
        state.currentSubIndex = subIndex;
        if (subIndex === 0) {
          state.lastTickTimestamp = Date.now();
          saveAppState();
        }

        // Mise à jour du compteur de mesure
        dom.measureIndicator.textContent = `MESURE #${measure}`;

        // Mise à jour des pastilles de temps
        const dots = dom.beatDotsContainer.children;
        for (let i = 0; i < dots.length; i++) {
          dots[i].classList.remove('active-red', 'active-green', 'active-mute');
          if (i === beatIndex) {
            if (beatType === 'accent') dots[i].classList.add('active-red');
            else if (beatType === 'normal') dots[i].classList.add('active-green');
            else dots[i].classList.add('active-mute');
          }
        }

        // Mise à jour des pastilles de subdivisions
        if (subdivisionCount > 1 && !dom.subdivisionPill.classList.contains('hidden')) {
          const subDots = dom.subdivisionPill.children;
          for (let i = 0; i < subDots.length; i++) {
            subDots[i].classList.toggle('active', i === subIndex);
          }
        }

        // Si temps principal (subIndex === 0), déclenchement du flash Pad Central + Halo
        if (subIndex === 0) {
          dom.centralPadNumber.textContent = String(beatIndex + 1);

          // Nettoyage classes précédentes
          dom.centralPad.classList.remove('flash-red', 'flash-green', 'flash-mute');
          dom.screenHalo.classList.remove('flash-red', 'flash-green');

          // Force reflow pour redéclencher l'animation même à 260 BPM
          void dom.centralPad.offsetWidth;

          if (beatType === 'accent') {
            dom.centralPad.classList.add('flash-red');
            if (state.haloOn) dom.screenHalo.classList.add('flash-red');
          } else if (beatType === 'normal') {
            dom.centralPad.classList.add('flash-green');
            if (state.haloOn) dom.screenHalo.classList.add('flash-green');
          } else {
            dom.centralPad.classList.add('flash-mute');
          }

          // Durée proportionnelle au tempo (entre 75ms et 160ms) pour un clignotement net à 260 BPM
          const beatDurationMs = (60 / state.bpm) * 1000;
          const flashDuration = Math.min(160, Math.max(65, beatDurationMs * 0.45));

          if (flashTimeoutId) clearTimeout(flashTimeoutId);
          flashTimeoutId = setTimeout(() => {
            dom.centralPad.classList.remove('flash-red', 'flash-green', 'flash-mute');
            dom.screenHalo.classList.remove('flash-red', 'flash-green');
          }, flashDuration);
        }
      }

      function visualRenderLoop() {
        if (state.isPlaying && audioCtx) {
          const currentTime = audioCtx.currentTime;
          while (visualQueue.length > 0 && visualQueue[0].time <= currentTime) {
            const event = visualQueue.shift();
            triggerVisualStep(event);
          }
        }
        rafId = requestAnimationFrame(visualRenderLoop);
      }

      /* ------------------------------------------------------------------------
         8. DÉMARRAGE / ARRÊT DU MÉTRONOME
         ------------------------------------------------------------------------ */
      function resetVisualState() {
        if (flashTimeoutId) clearTimeout(flashTimeoutId);
        visualQueue.length = 0;

        state.measureNumber = 0;
        state.currentBeatIndex = 0;
        state.currentSubIndex = 0;
        state.lastTickTimestamp = 0;

        dom.measureIndicator.textContent = 'MESURE #0';
        dom.centralPadNumber.textContent = '1';
        dom.centralPad.classList.remove('flash-red', 'flash-green', 'flash-mute');
        dom.screenHalo.classList.remove('flash-red', 'flash-green');

        const dots = dom.beatDotsContainer.children;
        for (let i = 0; i < dots.length; i++) {
          dots[i].classList.remove('active-red', 'active-green', 'active-mute');
        }

        const subDots = dom.subdivisionPill.children;
        for (let i = 0; i < subDots.length; i++) {
          subDots[i].classList.remove('active');
        }
      }

      function startMetronome(resumeFromSaved = false) {
        ensureAudioContext();
        requestScreenWakeLock();

        if (schedulerTimerId) {
          clearInterval(schedulerTimerId);
          schedulerTimerId = null;
        }

        state.isPlaying = true;
        if (resumeFromSaved) {
          scheduleMeasure = state.measureNumber;
          scheduleBeatIndex = state.currentBeatIndex;
          scheduleSubIndex = 0;
        } else {
          scheduleMeasure = 0;
          scheduleBeatIndex = 0;
          scheduleSubIndex = 0;
          state.measureNumber = 0;
          state.currentBeatIndex = 0;
          state.currentSubIndex = 0;
        }
        state.lastTickTimestamp = Date.now();
        visualQueue.length = 0;

        nextNoteTime = audioCtx.currentTime + 0.03;

        dom.btnTogglePlay.textContent = 'ARRÊTER';
        dom.btnTogglePlay.classList.add('playing');

        saveAppState();
        schedulerLoop();
        schedulerTimerId = setInterval(schedulerLoop, LOOKAHEAD_MS);
      }

      function stopMetronome() {
        state.isPlaying = false;
        if (schedulerTimerId) {
          clearInterval(schedulerTimerId);
          schedulerTimerId = null;
        }
        releaseScreenWakeLock();
        dom.btnTogglePlay.textContent = 'DÉMARRER';
        dom.btnTogglePlay.classList.remove('playing');
        resetVisualState();
        saveAppState();
      }

      /* ------------------------------------------------------------------------
         9. GESTION DES CONTRÔLES UTILISATEUR
         ------------------------------------------------------------------------ */
      function setBpm(newBpm) {
        const clamped = Math.min(MAX_BPM, Math.max(MIN_BPM, Math.round(Number(newBpm) || MIN_BPM)));
        state.bpm = clamped;
        dom.bpmInput.value = String(clamped);
        dom.bpmSlider.value = String(clamped);
        saveAppState();
      }

      // Boutons -5, -1, +1, +5
      dom.btnMinus5.addEventListener('click', () => setBpm(state.bpm - 5));
      dom.btnMinus1.addEventListener('click', () => setBpm(state.bpm - 1));
      dom.btnPlus1.addEventListener('click', () => setBpm(state.bpm + 1));
      dom.btnPlus5.addEventListener('click', () => setBpm(state.bpm + 5));

      // Saisie directe BPM
      dom.bpmInput.addEventListener('change', () => setBpm(dom.bpmInput.value));
      dom.bpmInput.addEventListener('blur', () => setBpm(dom.bpmInput.value));
      dom.bpmInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          setBpm(dom.bpmInput.value);
          dom.bpmInput.blur();
        }
      });

      // Slider BPM
      dom.bpmSlider.addEventListener('input', (e) => setBpm(e.target.value));

      // Tap Tempo (moyenne glissante des 4 derniers intervalles)
      let tapTimestamps = [];
      dom.btnTap.addEventListener('click', () => {
        const now = performance.now();
        if (tapTimestamps.length > 0 && now - tapTimestamps[tapTimestamps.length - 1] > 2200) {
          tapTimestamps = [];
        }
        tapTimestamps.push(now);
        if (tapTimestamps.length > 5) {
          tapTimestamps.shift();
        }

        dom.btnTap.classList.add('tapped');
        setTimeout(() => dom.btnTap.classList.remove('tapped'), 120);

        if (tapTimestamps.length >= 2) {
          let totalInterval = 0;
          for (let i = 1; i < tapTimestamps.length; i++) {
            totalInterval += tapTimestamps[i] - tapTimestamps[i - 1];
          }
          const avgIntervalMs = totalInterval / (tapTimestamps.length - 1);
          const calculatedBpm = Math.round(60000 / avgIntervalMs);
          setBpm(calculatedBpm);
        }
      });

      // Bouton Démarrer / Arrêter
      dom.btnTogglePlay.addEventListener('click', () => {
        if (state.isPlaying) {
          stopMetronome();
        } else {
          startMetronome();
        }
      });

      // Barre espace pour démarrer/arrêter facilement
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement !== dom.bpmInput) {
          e.preventDefault();
          dom.btnTogglePlay.click();
        }
      });

      // Signatures Rythmiques (2/4, 3/4, 4/4, 5/4)
      dom.sigButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mode = 'preset';
          state.presetBeats = Number(btn.dataset.beats);

          dom.sigButtons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          dom.btnPerso.classList.remove('active');
          dom.persoDrawer.classList.remove('open');

          if (scheduleBeatIndex >= state.presetBeats) {
            scheduleBeatIndex = 0;
          }
          renderBeatDots();
          saveAppState();
        });
      });

      // Bouton Perso & Tiroir personnalisé (1 à 16 temps)
      dom.btnPerso.addEventListener('click', () => {
        const wasCustom = state.mode === 'custom';
        state.mode = 'custom';

        dom.sigButtons.forEach((b) => b.classList.remove('active'));
        dom.btnPerso.classList.add('active');

        if (wasCustom) {
          dom.persoDrawer.classList.toggle('open');
        } else {
          dom.persoDrawer.classList.add('open');
        }

        renderPersoDrawer();
        renderBeatDots();
        saveAppState();
      });

      dom.persoMinus.addEventListener('click', () => {
        if (state.customBeatsCount > 1) {
          state.customBeatsCount--;
          if (scheduleBeatIndex >= state.customBeatsCount) {
            scheduleBeatIndex = 0;
          }
          renderPersoDrawer();
          renderBeatDots();
          saveAppState();
        }
      });

      dom.persoPlus.addEventListener('click', () => {
        if (state.customBeatsCount < 16) {
          state.customBeatsCount++;
          renderPersoDrawer();
          renderBeatDots();
          saveAppState();
        }
      });

      // Subdivisions (Noires = 1, Croches = 2, Doubles = 4)
      dom.subButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          state.subdivision = Number(btn.dataset.sub);
          scheduleSubIndex = 0;

          dom.subButtons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          renderSubdivisionDots();
          saveAppState();
        });
      });

      // Bascules Audio & Visuelles (Bip ON, Croche ON, Halo ON)
      dom.toggleBip.addEventListener('click', () => {
        state.bipOn = !state.bipOn;
        dom.toggleBip.classList.toggle('active', state.bipOn);
        dom.toggleBip.setAttribute('aria-pressed', String(state.bipOn));
        dom.toggleBip.textContent = state.bipOn ? 'Bip ON' : 'Bip OFF';
        saveAppState();
      });

      dom.toggleCroche.addEventListener('click', () => {
        state.crocheOn = !state.crocheOn;
        dom.toggleCroche.classList.toggle('active', state.crocheOn);
        dom.toggleCroche.setAttribute('aria-pressed', String(state.crocheOn));
        dom.toggleCroche.textContent = state.crocheOn ? 'Croche ON' : 'Croche OFF';
        saveAppState();
      });

      dom.toggleHalo.addEventListener('click', () => {
        state.haloOn = !state.haloOn;
        dom.toggleHalo.classList.toggle('active', state.haloOn);
        dom.toggleHalo.setAttribute('aria-pressed', String(state.haloOn));
        dom.toggleHalo.textContent = state.haloOn ? 'Halo ON' : 'Halo OFF';
        if (!state.haloOn) {
          dom.screenHalo.classList.remove('flash-red', 'flash-green');
        }
        saveAppState();
      });

      /* ------------------------------------------------------------------------
         10. CONTINUITÉ LORS DES ROTATIONS & INITIALISATION AU CHARGEMENT
         ------------------------------------------------------------------------ */
      function handleViewportOrOrientationChange() {
        saveAppState();
        requestScreenWakeLock();
        if (state.isPlaying) {
          ensureAudioContext();
        }
      }

      window.addEventListener('orientationchange', handleViewportOrOrientationChange, { passive: true });
      window.addEventListener('resize', handleViewportOrOrientationChange, { passive: true });
      window.addEventListener('beforeunload', saveAppState);
      window.addEventListener('pagehide', saveAppState);

      if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
        window.screen.orientation.addEventListener('change', handleViewportOrOrientationChange);
      }

      window.addEventListener('pageshow', (event) => {
        if (event.persisted && state.isPlaying) {
          ensureAudioContext();
          requestScreenWakeLock();
        }
      });

      // Débloque immédiatement l'AudioContext au premier toucher si le navigateur l'a suspendu après un rechargement en rotation
      window.addEventListener('pointerdown', () => {
        if (state.isPlaying && audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }, { passive: true });

      function initApp() {
        initDynamicPWAManifest();
        requestScreenWakeLock();
        const hadSavedState = loadAppState();

        renderBeatDots();
        renderSubdivisionDots();
        renderPersoDrawer();
        syncControlsWithState();

        rafId = requestAnimationFrame(visualRenderLoop);

        if (hadSavedState && state.isPlaying) {
          startMetronome(true);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
      } else {
        initApp();
      }
    })();
  </script>
</body>
</html>
