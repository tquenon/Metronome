<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0E14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="FlashBeat - Métronome visuel haute précision pour batteurs sur scène." />
  <link id="pwa-manifest" rel="manifest" href="" />
  
  <title>FlashBeat — Métronome Visuel de Scène</title>

  <link rel="stylesheet" href="css/style.css">
  
</head>
<body>
  <!-- Halo / Bande lumineuse périphérique -->
  <div id="screen-halo" aria-hidden="true"></div>

  <div id="app">
    <!-- En-tête minimaliste sans boutons superflus -->
    <header>
      <div class="logo" aria-label="FlashBeat">
        <span class="flash">Flash</span><span class="beat">Beat</span>
      </div>
    </header>

    <main>
      <!-- ZONE VISUELLE (Haut en portrait / 55% gauche en paysage) -->
      <section id="visual-stage" aria-label="Affichage visuel du métronome">
        <div id="measure-indicator" class="measure-label">MESURE #0</div>

        <!-- Pastilles de temps -->
        <div id="beat-dots-container" class="beat-dots-row" role="status" aria-live="off"></div>

        <!-- Pad Central Parfaitement Rond (1:1) -->
        <div class="pad-wrapper">
          <div id="central-pad">
            <span id="central-pad-number">1</span>
          </div>
        </div>

        <!-- Subdivisions (Croches / Doubles) -->
        <div id="subdivision-pill" aria-hidden="true"></div>
      </section>

      <!-- ZONE DE CONTRÔLES (Bas en portrait / 45% droite en paysage) -->
      <section id="controls-panel" aria-label="Paramètres du métronome">
        <!-- 1. Ligne Tempo -->
        <div class="tempo-row">
          <button type="button" class="ctrl-btn" id="btn-minus-5" aria-label="Diminuer de 5 BPM">-5</button>
          <button type="button" class="ctrl-btn" id="btn-minus-1" aria-label="Diminuer de 1 BPM">-1</button>

          <label class="bpm-display-box" for="bpm-input" title="Cliquer pour saisir un tempo entre 30 et 260">
            <input type="number" id="bpm-input" value="120" min="30" max="260" inputmode="numeric" aria-label="Tempo en BPM" />
            <span class="bpm-unit">BPM</span>
          </label>

          <button type="button" class="ctrl-btn" id="btn-plus-1" aria-label="Augmenter de 1 BPM">+1</button>
          <button type="button" class="ctrl-btn" id="btn-plus-5" aria-label="Augmenter de 5 BPM">+5</button>
          <button type="button" class="ctrl-btn" id="btn-tap" aria-label="Tap tempo">TAP</button>
        </div>

        <!-- 2. Curseur (Slider) -->
        <div class="slider-container">
          <span class="slider-bound">30</span>
          <input type="range" id="bpm-slider" min="30" max="260" value="120" aria-label="Curseur de tempo" />
          <span class="slider-bound">260</span>
        </div>

        <!-- 3. Bouton Principal Démarrer / Arrêter -->
        <button type="button" id="btn-toggle-play">DÉMARRER</button>

        <!-- 4. Signature Rythmique -->
        <div class="control-group">
          <div class="section-title">Signature Rythmique</div>
          <div class="sig-grid">
            <button type="button" class="ctrl-btn sig-btn" data-beats="2">2/4</button>
            <button type="button" class="ctrl-btn sig-btn" data-beats="3">3/4</button>
            <button type="button" class="ctrl-btn sig-btn active" data-beats="4">4/4</button>
            <button type="button" class="ctrl-btn sig-btn" data-beats="5">5/4</button>
          </div>
          <button type="button" class="ctrl-btn" id="btn-perso">Perso</button>

          <!-- Panneau de configuration Perso (1 à 16 temps + accents) -->
          <div id="perso-drawer" aria-label="Configuration rythmique personnalisée">
            <div class="perso-header">
              <div class="perso-count-controls">
                <button type="button" class="ctrl-btn perso-step-btn" id="perso-minus" aria-label="Retirer un temps">-</button>
                <span id="perso-count-label">6 temps</span>
                <button type="button" class="ctrl-btn perso-step-btn" id="perso-plus" aria-label="Ajouter un temps">+</button>
              </div>
              <div class="perso-legend">
                <span class="legend-item"><span class="legend-dot" style="background: var(--accent-red);"></span>Fort</span>
                <span class="legend-item"><span class="legend-dot" style="background: var(--accent-green);"></span>Normal</span>
                <span class="legend-item"><span class="legend-dot" style="background: var(--beat-mute);"></span>Muet</span>
              </div>
            </div>
            <div id="perso-beats-grid" class="perso-beats-grid"></div>
          </div>
        </div>

        <!-- 5. Subdivisions -->
        <div class="control-group">
          <div class="section-title">Subdivisions</div>
          <div class="sub-grid">
            <button type="button" class="ctrl-btn sub-btn" data-sub="1">Noires</button>
            <button type="button" class="ctrl-btn sub-btn" data-sub="2">Croches</button>
            <button type="button" class="ctrl-btn sub-btn active" data-sub="4">Doubles</button>
          </div>
        </div>

        <!-- 6. Options Audio & Visuelles -->
        <div class="toggles-grid">
          <button type="button" class="ctrl-btn toggle-btn active" id="toggle-bip" aria-pressed="true">Bip ON</button>
          <button type="button" class="ctrl-btn toggle-btn active" id="toggle-croche" aria-pressed="true">Croche ON</button>
          <button type="button" class="ctrl-btn toggle-btn active" id="toggle-halo" aria-pressed="true">Halo ON</button>
        </div>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
  
</body>
</html>
